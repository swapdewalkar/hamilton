# Hamilton Environment-Specific Configuration
# This file contains environment-specific settings that can be easily changed
# between different deployment environments (development, testing, staging, production)
# Values can be overridden by environment variables or command-line arguments

# =============================================================================
# Environment Selection
# =============================================================================
[environment]
# The active environment to use (development, testing, staging, production)
active=development

# =============================================================================
# Database Configuration
# =============================================================================
[database.development]
# Development database settings
db.url=jdbc:postgresql://localhost:5432/hamilton_dev
db.username=hamilton_dev
db.password=dev_password
db.pool.size=5
db.pool.max=10
db.timeout.connection=30000
db.timeout.query=60000

[database.testing]
# Testing database settings
db.url=jdbc:postgresql://localhost:5432/hamilton_test
db.username=hamilton_test
db.password=test_password
db.pool.size=5
db.pool.max=10
db.timeout.connection=30000
db.timeout.query=60000

[database.staging]
# Staging database settings
db.url=jdbc:postgresql://db.staging.example.com:5432/hamilton_staging
db.username=hamilton_staging
db.password=staging_password
db.pool.size=10
db.pool.max=20
db.timeout.connection=30000
db.timeout.query=60000

[database.production]
# Production database settings
db.url=jdbc:postgresql://db.production.example.com:5432/hamilton_production
db.username=hamilton_production
db.password=production_password
db.pool.size=20
db.pool.max=50
db.timeout.connection=30000
db.timeout.query=60000

# =============================================================================
# Application Settings
# =============================================================================
[application.development]
# Development application settings
app.log.level=DEBUG
app.log.path=logs/hamilton_dev.log
app.max.threads=2
app.data.dir=data/development

[application.testing]
# Testing application settings
app.log.level=DEBUG
app.log.path=logs/hamilton_test.log
app.max.threads=2
app.data.dir=data/testing

[application.staging]
# Staging application settings
app.log.level=INFO
app.log.path=logs/hamilton_staging.log
app.max.threads=4
app.data.dir=data/staging

[application.production]
# Production application settings
app.log.level=WARN
app.log.path=logs/hamilton_production.log
app.max.threads=8
app.data.dir=data/production

# =============================================================================
# Feature Flags
# =============================================================================
[features.development]
# Development feature flags
features.experimental.enabled=true
features.telemetry.enabled=true
features.power_user_mode=true
features.caching.enabled=true
features.parallel_execution.enabled=true
features.visualization.enabled=true

[features.testing]
# Testing feature flags
features.experimental.enabled=true
features.telemetry.enabled=true
features.power_user_mode=false
features.caching.enabled=true
features.parallel_execution.enabled=true
features.visualization.enabled=true

[features.staging]
# Staging feature flags
features.experimental.enabled=false
features.telemetry.enabled=true
features.power_user_mode=false
features.caching.enabled=true
features.parallel_execution.enabled=true
features.visualization.enabled=true

[features.production]
# Production feature flags
features.experimental.enabled=false
features.telemetry.enabled=true
features.power_user_mode=false
features.caching.enabled=true
features.parallel_execution.enabled=true
features.visualization.enabled=true

# =============================================================================
# Timeout Values
# =============================================================================
[timeouts.development]
# Development timeout settings (in milliseconds)
timeout.default=60000
timeout.http.connection=10000
timeout.http.read=60000
timeout.cache.expiry=60000
timeout.job.execution=600000
timeout.driver.execution=120000

[timeouts.testing]
# Testing timeout settings (in milliseconds)
timeout.default=30000
timeout.http.connection=5000
timeout.http.read=30000
timeout.cache.expiry=60000
timeout.job.execution=300000
timeout.driver.execution=60000

[timeouts.staging]
# Staging timeout settings (in milliseconds)
timeout.default=30000
timeout.http.connection=5000
timeout.http.read=30000
timeout.cache.expiry=3600000
timeout.job.execution=300000
timeout.driver.execution=60000

[timeouts.production]
# Production timeout settings (in milliseconds)
timeout.default=30000
timeout.http.connection=5000
timeout.http.read=30000
timeout.cache.expiry=3600000
timeout.job.execution=300000
timeout.driver.execution=60000

# =============================================================================
# Storage Configuration
# =============================================================================
[storage.development]
# Development storage settings
storage.type=local
storage.local.path=data/development/storage
storage.s3.bucket=hamilton-dev
storage.s3.region=us-west-2
storage.s3.endpoint=
storage.blob.prefix=hamilton-dev

[storage.testing]
# Testing storage settings
storage.type=local
storage.local.path=data/testing/storage
storage.s3.bucket=hamilton-test
storage.s3.region=us-west-2
storage.s3.endpoint=
storage.blob.prefix=hamilton-test

[storage.staging]
# Staging storage settings
storage.type=s3
storage.local.path=data/staging/storage
storage.s3.bucket=hamilton-staging
storage.s3.region=us-west-2
storage.s3.endpoint=
storage.blob.prefix=hamilton-staging

[storage.production]
# Production storage settings
storage.type=s3
storage.local.path=data/production/storage
storage.s3.bucket=hamilton-production
storage.s3.region=us-west-2
storage.s3.endpoint=
storage.blob.prefix=hamilton-production

# =============================================================================
# API Configuration
# =============================================================================
[api.development]
# Development API settings
api.enabled=true
api.port=8080
api.host=localhost
api.base.path=/api/v1
api.rate.limit=1000
api.timeout=60000
api.cors.enabled=true
api.cors.origins=http://localhost:3000,http://localhost:8000

[api.testing]
# Testing API settings
api.enabled=true
api.port=8080
api.host=localhost
api.base.path=/api/v1
api.rate.limit=1000
api.timeout=30000
api.cors.enabled=true
api.cors.origins=http://localhost:3000,http://localhost:8000

[api.staging]
# Staging API settings
api.enabled=true
api.port=8080
api.host=api.staging.example.com
api.base.path=/api/v1
api.rate.limit=500
api.timeout=30000
api.cors.enabled=true
api.cors.origins=https://app.staging.example.com

[api.production]
# Production API settings
api.enabled=true
api.port=8080
api.host=api.example.com
api.base.path=/api/v1
api.rate.limit=100
api.timeout=30000
api.cors.enabled=true
api.cors.origins=https://app.example.com
