# Hamilton Environment Configuration
# This file contains environment-specific settings for the Hamilton framework
# Values can be overridden by environment variables or command-line arguments

# =============================================================================
# Database Configuration
# =============================================================================
[database]
# Database connection settings
db.url=jdbc:postgresql://localhost:5432/hamilton
db.username=hamilton_user
db.password=change_me_in_production
db.pool.size=10
db.pool.max=20
db.timeout.connection=30000
db.timeout.query=60000

# =============================================================================
# Application Settings
# =============================================================================
[application]
# General application settings
app.name=Hamilton
app.version=1.0.0
app.environment=development
app.log.level=INFO
app.log.path=logs/hamilton.log
app.max.threads=4
app.data.dir=data

# =============================================================================
# Feature Flags
# =============================================================================
[features]
# Feature toggles for enabling/disabling functionality
features.experimental.enabled=false
features.telemetry.enabled=true
features.power_user_mode=false
features.caching.enabled=true
features.parallel_execution.enabled=true
features.visualization.enabled=true

# =============================================================================
# Environment-specific Settings
# =============================================================================
[environment.development]
# Development environment settings
env.dev.debug=true
env.dev.mock.data=true
env.dev.auto.reload=true
env.dev.profile=true

[environment.testing]
# Testing environment settings
env.test.debug=false
env.test.mock.data=true
env.test.auto.reload=false
env.test.profile=true

[environment.production]
# Production environment settings
env.prod.debug=false
env.prod.mock.data=false
env.prod.auto.reload=false
env.prod.profile=false

# =============================================================================
# Timeout Values
# =============================================================================
[timeouts]
# Various timeout settings in milliseconds
timeout.default=30000
timeout.http.connection=5000
timeout.http.read=30000
timeout.cache.expiry=3600000
timeout.job.execution=300000
timeout.driver.execution=60000

# =============================================================================
# Storage Configuration
# =============================================================================
[storage]
# Storage settings for data persistence
storage.type=local
storage.local.path=data/storage
storage.s3.bucket=hamilton-data
storage.s3.region=us-west-2
storage.s3.endpoint=
storage.blob.prefix=hamilton

# =============================================================================
# API Configuration
# =============================================================================
[api]
# API settings
api.enabled=true
api.port=8080
api.host=localhost
api.base.path=/api/v1
api.rate.limit=100
api.timeout=30000
api.cors.enabled=true
api.cors.origins=http://localhost:3000,http://localhost:8000

# =============================================================================
# Authentication Configuration
# =============================================================================
[auth]
# Authentication settings
auth.mode=permissive
auth.token.expiry=86400
auth.token.refresh=604800
auth.propel.api.key=
auth.propel.url=
